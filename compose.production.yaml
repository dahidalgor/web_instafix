services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: instafix
      POSTGRES_DB: instafix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U instafix -d instafix']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      target: api
      args:
        VITE_ADMIN_HOST: ${ADMIN_HOST}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://instafix:${POSTGRES_PASSWORD}@db:5432/instafix
      ALLOWED_ORIGINS: https://${PUBLIC_HOST},https://${ADMIN_HOST}
      MEDIA_STORAGE: r2
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
      args:
        VITE_ADMIN_HOST: ${ADMIN_HOST}
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
