services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: instafix
      POSTGRES_PASSWORD: Daviti33
      POSTGRES_DB: instafix
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - instafix_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U instafix -d instafix']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  instafix_data:
